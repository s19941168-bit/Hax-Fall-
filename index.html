<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hex Fall 3D</title><meta name="theme-color" content="#1b0f3d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hex Fall"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/favicon-64.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#fff;--ac:#ffb02e;--pn:#4a2fa0}
html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:"Trebuchet MS",system-ui,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;margin:0 auto;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));background:#4aa8ff;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;font-size:17px;text-shadow:0 2px 0 #0006,0 0 6px #000;pointer-events:none}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;padding:0 10px;text-shadow:0 1px 3px #000;pointer-events:none}
#joy{position:absolute;width:90px;height:90px;margin:-45px;border:3px solid #fff8;border-radius:50%;display:none;pointer-events:none}
#knob{position:absolute;left:25px;top:25px;width:40px;height:40px;border-radius:50%;background:#fffb}
#jb{position:absolute;right:18px;bottom:60px;width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:#2e7dff;font-size:34px;padding:0;display:none;box-shadow:0 5px 0 #153f8a;touch-action:none}
#jb:active{transform:translateY(3px)}
#ui{position:absolute;inset:0;background:linear-gradient(#1b0f3d55,#1b0f3d10 40%,#1b0f3daa);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px;overflow:auto}
.top{text-align:center;margin-top:6%}.bot{display:flex;flex-direction:column;gap:12px;margin-bottom:6%}
.logo2{font-size:62px;line-height:.95;font-weight:900;letter-spacing:3px;background:linear-gradient(#fff3a0,#ff9a1f 60%,#e53935);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #4a1500) drop-shadow(0 0 14px #ff9a1f88);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.sub{font-size:15px;font-weight:700;text-shadow:0 2px 4px #000;margin-top:8px}
.gl{background:#241257d9;backdrop-filter:blur(8px);border:2px solid #ffffff30;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
h2{margin:0;text-align:center;color:var(--ac);font-size:28px;text-shadow:0 3px 0 #5a2200}
label{font-size:14px;opacity:.9;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{padding:13px 8px;border:0;border-radius:16px;background:linear-gradient(#ffffff,#cfe0ff);color:#2a1466;font-size:16px;font-weight:800;font-family:inherit;box-shadow:0 4px 0 #6b7fc4}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b7fc4}
button.on{background:linear-gradient(#ffe082,#ffa000);color:#3a1a00;box-shadow:0 4px 0 #a35d00}button.big{background:linear-gradient(#7bf59a,#22b14c);color:#05361a;font-size:24px;padding:18px;box-shadow:0 5px 0 #11692b}
input[type=range]{width:100%;accent-color:var(--ac)}.coin{text-align:center;font-size:20px;font-weight:800}
.sk{min-width:72px;display:flex;flex-direction:column;align-items:center;gap:6px}.sw{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:4px solid #fff}
#ui.sh{pointer-events:none}#ui.sh>*{pointer-events:auto}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:8px 4px}.th{flex:none;width:54px;height:54px;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;opacity:.75}.th.on{opacity:1;transform:scale(1.18)}.th b{position:absolute;right:-6px;bottom:-6px;font-size:14px}
#load{position:absolute;inset:0;z-index:9;background:radial-gradient(circle at 50% 35%,#8a4dff,#1b0f3d 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.bar{width:60%;height:14px;border-radius:9px;background:#0004;border:2px solid #fff6;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb02e,#ff5a4d)}
#lt{font-weight:800;font-size:18px;min-height:24px}.blink{animation:bk 1s infinite}@keyframes bk{50%{opacity:.25}}

/* ===== UI v2 ===== */
#ui::-webkit-scrollbar{width:0}
.gl{background:linear-gradient(#41279a,#2a1568);border:4px solid #ffd76a;border-radius:28px;padding:16px 14px 14px;gap:12px;backdrop-filter:none;box-shadow:0 0 0 4px #150a38,0 10px 0 4px #0d0624,0 22px 40px #000b,inset 0 3px 0 #ffffff3a}
.gl.c{margin:auto 0}
h2{background:linear-gradient(#ffe082,#ffa000);color:#4a2000;text-shadow:0 2px 0 #fff7;border:3px solid #150a38;border-radius:16px;padding:8px 14px;font-size:24px;box-shadow:0 4px 0 #a35d00}
.sec{background:#12083199;border:2px solid #ffffff24;border-radius:18px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 3px 10px #000a}
.sec>label{margin:0;font-weight:900;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#ffd76a;opacity:1}
button{padding:12px 10px;border:3px solid #150a38;border-radius:16px;background:linear-gradient(#fff,#dbe6ff 55%,#b3c7ff);color:#2a1466;font-size:16px;font-weight:900;box-shadow:0 5px 0 #4b5fb0,inset 0 2px 0 #fff;cursor:pointer;transition:transform .06s,filter .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #4b5fb0,inset 0 2px 0 #fff}
button.on{background:linear-gradient(#fff0a8,#ffb300 60%,#ff9100);color:#3a1a00;box-shadow:0 5px 0 #a35d00,inset 0 2px 0 #fffa}
button.big{background:linear-gradient(#9dfbb4,#2ccc5c 60%,#17a443);color:#052e15;font-size:24px;padding:16px;box-shadow:0 6px 0 #0f6b2c,inset 0 2px 0 #d8ffe3}
button.big:active{box-shadow:0 2px 0 #0f6b2c}
button small{font-size:12px;opacity:.75;font-weight:800}
.seg{display:flex;gap:7px}.seg button{flex:1;padding:9px 4px;font-size:14px;border-radius:13px;line-height:1.2;box-shadow:0 4px 0 #4b5fb0,inset 0 2px 0 #fff}.seg button.on{box-shadow:0 4px 0 #a35d00,inset 0 2px 0 #fffa}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 44%}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.maps button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:12px;border-radius:14px}.maps button span{font-size:26px;line-height:1.1}
.sl{display:flex;align-items:center;gap:10px}.sl i{font-style:normal;font-size:24px}.sl b{min-width:46px;text-align:center;background:#0009;border:2px solid #ffd76a88;border-radius:11px;padding:4px 0;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:20px;margin:10px 0;border-radius:12px;border:3px solid #150a38;outline:none;background:linear-gradient(90deg,#ffb02e,#ff5a4d) left/var(--p,50%) 100% no-repeat,#0b0522;box-shadow:inset 0 3px 5px #000a,0 2px 0 #ffffff30}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe082 40%,#ffa000);border:4px solid #150a38;box-shadow:0 3px 0 #a35d00;cursor:pointer}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe082 40%,#ffa000);border:4px solid #150a38;box-shadow:0 3px 0 #a35d00;cursor:pointer}
input[type=range]::-moz-range-track{background:transparent}
.coin{background:#0008;border:2px solid #ffd76a88;border-radius:18px;padding:6px 16px;align-self:center;width:max-content;max-width:100%;box-sizing:border-box}
/* end screens */
#end{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;overflow:auto;box-sizing:border-box}
#end.win{background:radial-gradient(circle at 50% 24%,#fff9b0,#ffc02e 38%,#d9560b 100%)}
#end.lose{background:radial-gradient(circle at 50% 26%,#6a44a8,#2c1356 55%,#0c041d 100%)}
#end>*{position:relative}
#end .ic{font-size:96px;line-height:1;filter:drop-shadow(0 8px 0 #0005);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
#end h1{margin:0;font-size:42px;line-height:1.05;font-weight:900;text-shadow:0 4px 0 #0007;animation:pop .6s .15s cubic-bezier(.2,1.6,.4,1) both}
.medal{width:128px;height:128px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid #fff;animation:pop .6s .3s cubic-bezier(.2,1.6,.4,1) both}
#end.win .medal{background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc107 55%,#b26a00);box-shadow:0 0 0 6px #ffffff55,0 10px 0 #7a4300,0 0 40px #fff9}
#end.lose .medal{background:radial-gradient(circle at 35% 30%,#a58be0,#5b3aa8 60%,#2d1a6a);box-shadow:0 0 0 6px #ffffff22,0 10px 0 #140a33}
.medal b{font-size:60px;line-height:1;text-shadow:0 3px 0 #0006}.medal small{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.sub2{font-size:20px;font-weight:800;text-shadow:0 2px 0 #0007}
.praise{font-size:26px;font-weight:900;color:#ffe082;text-shadow:0 3px 0 #0009}
.pay{background:#0007;border:3px solid #ffffff55;border-radius:20px;padding:10px 26px;font-size:20px;font-weight:900;line-height:1.5}.pay span{font-size:34px}
.col{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.cf{position:absolute!important;top:-24px;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:cfall 3s linear infinite}
@keyframes cfall{to{transform:translateY(120vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}

/* ===== UI v3: coin, wallet, map picker, carousel, end screens ===== */
@keyframes spin{to{transform:rotate(360deg)}}
.ci{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.24em;flex:none;filter:drop-shadow(0 2px 0 #6a3a00aa)}
.ci.spin{animation:cspin 2.8s ease-in-out infinite}
@keyframes cspin{0%{transform:perspective(300px) rotateY(0)}60%,100%{transform:perspective(300px) rotateY(360deg)}}
.wb{position:absolute;top:14px;right:14px;z-index:2;display:flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;border-radius:32px;background:linear-gradient(#3a2294,#1d0e52);border:3px solid #ffd76a;color:#fff;box-shadow:0 5px 0 #0d0624,0 0 18px #ffb02e66,inset 0 2px 0 #ffffff33}
.wb:active{box-shadow:0 1px 0 #0d0624,0 0 18px #ffb02e66,inset 0 2px 0 #ffffff33}
.wl{display:flex;flex-direction:column;align-items:flex-start;line-height:1;text-align:left}.wl small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#ffd76a;font-weight:900}.wl b{font-size:22px;font-weight:900;text-shadow:0 2px 0 #0008}
.top.mt{margin-top:62px}
.wh{display:flex;flex-direction:column;align-items:center;gap:4px;filter:drop-shadow(0 0 22px #ffb02e99)}
.wbal{text-align:center}.wbal small{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#ffd76a;font-weight:800}.wbal b{font-size:50px;line-height:1;font-weight:900;text-shadow:0 4px 0 #0009}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wg>div{background:#12083199;border:2px solid #ffffff24;border-radius:16px;padding:8px 10px;box-shadow:inset 0 3px 10px #000a;display:flex;flex-direction:column;align-items:center}.wg small{font-size:11px;opacity:.75;font-weight:800;text-transform:uppercase;letter-spacing:.6px}.wg b{font-size:24px;font-weight:900;color:#ffe082}
.lr{display:flex;justify-content:space-between;align-items:center;background:#ffffff12;border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px}.lr b{color:#ffe082;display:flex;align-items:center;gap:4px}

/* setup / live map preview */
.pvl{margin:6px auto 0;display:flex;align-items:center;gap:10px;background:#0b0420bb;border:3px solid #ffffff33;border-radius:30px;padding:6px 16px;font-size:20px;font-weight:900;box-shadow:0 4px 0 #0008;text-shadow:0 2px 0 #000a}
.live{font-size:11px;font-weight:900;letter-spacing:1px;color:#fff;background:#e53935;border-radius:8px;padding:3px 7px;animation:bk 1.4s infinite;text-shadow:none}
.gl.pvp{gap:8px;padding:10px 12px 12px}
.hnt{text-align:center;font-size:12px;font-weight:800;margin:6px 0 auto;text-shadow:0 2px 4px #000,0 0 8px #000a}
.pvp .sec{padding:8px 10px 10px;gap:6px}.sec.s2{gap:8px}.sec.s2>div{display:flex;flex-direction:column;gap:5px}.sec.s2 label{font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#ffd76a;margin:0}.sec.s2 .sl input{margin:4px 0}
button.bk{flex:0 0 58px;font-size:24px;padding:10px 0}
button.mc{flex:none;scroll-snap-align:center;width:142px;height:112px;padding:0;border:4px solid #150a38;border-radius:22px;color:#fff;text-shadow:0 2px 0 #000a;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 #0d0624,inset 0 2px 0 #ffffff66;transition:transform .15s,box-shadow .15s}
button.mc:hover{transform:translateY(-3px)}
button.mc .me{font-size:50px;line-height:1;filter:drop-shadow(0 5px 0 #0006)}
button.mc .mn{font-size:16px;font-weight:900;background:#0008;border-radius:12px;padding:3px 12px}
button.mc .ck{display:none;position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#22b14c;border:3px solid #fff;font-style:normal;font-size:13px;line-height:18px;text-align:center}
button.mc.on{color:#fff;border-color:#ffd76a;transform:translateY(-4px) scale(1.04);box-shadow:0 0 0 3px #ffd76a66,0 0 24px #ffd76acc,0 5px 0 #a35d00,inset 0 2px 0 #ffffff88}
button.mc.on .ck{display:block}

/* carousels (maps + skins) with custom progress track */
.thumbs{position:relative;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:14px 20px 12px;margin:-4px -2px 0;-webkit-mask-image:linear-gradient(90deg,#0000 0,#000 22px,#000 calc(100% - 22px),#0000 100%);mask-image:linear-gradient(90deg,#0000 0,#000 22px,#000 calc(100% - 22px),#0000 100%)}
.thumbs::-webkit-scrollbar{display:none}
.prog{position:relative;height:12px;border-radius:8px;background:#0b0522;border:3px solid #150a38;cursor:pointer;touch-action:none;box-shadow:inset 0 2px 4px #000a,0 2px 0 #ffffff26;flex:none}
.prog i{position:absolute;top:0;bottom:0;left:0;width:30%;border-radius:8px;background:linear-gradient(#ffe082,#ffa000);box-shadow:0 0 8px #ffb300aa,inset 0 1px 0 #fff9}
.th{flex:none;scroll-snap-align:center;width:70px;height:90px;border-radius:20px;border:4px solid var(--c2,#fff);background:linear-gradient(var(--c1,#888),#1b0f45 160%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;opacity:.8;box-shadow:0 4px 0 #0d0624,inset 0 2px 0 #ffffff55;transition:transform .15s,opacity .15s;font-size:26px}
.th .e{font-size:34px;line-height:1;filter:drop-shadow(0 3px 0 #0006)}
.th em{font-style:normal;font-size:12px;font-weight:900;background:#000a;border-radius:10px;padding:2px 6px;display:flex;align-items:center;gap:2px;min-height:16px}
.th em:empty{display:none}
.th.lk .e{filter:grayscale(.5) drop-shadow(0 3px 0 #0006)}
.th.on{opacity:1;transform:translateY(-4px) scale(1.12);box-shadow:0 0 0 3px #ffd76a,0 0 20px #ffd76acc,0 4px 0 #a35d00,inset 0 2px 0 #ffffff77}

/* ===== end screens v3 ===== */
#end{gap:8px;justify-content:flex-start;padding:18px}
#end.win{background:radial-gradient(circle at 50% 28%,#fff7b8 0,#ffc93c 28%,#ff8a1f 60%,#a82a08 100%)}
#end.lose{background:radial-gradient(circle at 50% 24%,#5b3fa6 0,#2a1259 46%,#09021a 100%)}
#end>.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rays{position:absolute;left:50%;top:26%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(#ffffff40 0 7deg,#ffffff00 7deg 14deg);animation:spin 30s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,#0000 38%);mask-image:radial-gradient(circle,#000 0,#0000 38%)}
.vg{position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,#ff5a1f55 0,#0000 55%),radial-gradient(circle,#0000 50%,#000a 100%)}
.em{position:absolute;bottom:-16px;border-radius:50%;background:radial-gradient(#ffe0a0,#ff5a1f);box-shadow:0 0 8px #ff7a2f;animation:rise 4s linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-115vh);opacity:0}}
.sp{position:absolute;color:#fff;font-size:22px;text-shadow:0 0 10px #fff;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1.2);opacity:1}}
.hero{margin-top:auto;width:min(44%,160px);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,flo 3s 1s ease-in-out infinite;filter:drop-shadow(0 10px 0 #0004)}
.hero svg{width:100%;display:block}.hw{filter:drop-shadow(0 0 22px #fff9) drop-shadow(0 10px 0 #0004)}
@keyframes flo{50%{transform:translateY(-8px) rotate(2deg)}}
.rib{display:flex;align-items:center;gap:12px;padding:8px 22px;border-radius:18px;font-size:clamp(24px,8.5vw,38px);font-weight:900;letter-spacing:1.5px;white-space:nowrap;border:4px solid #4a2000;box-shadow:0 6px 0 #7a4300,0 0 0 4px #ffffff55;overflow:hidden;animation:pop .6s .2s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 3px 0 #fff8}
#end.win .rib{background:linear-gradient(#fff4a8,#ffc107 55%,#ff9100);color:#4a2000}
#end.lose .rib{background:linear-gradient(#9a78e8,#5a35b0 60%,#34207a);color:#fff;border-color:#0c041d;box-shadow:0 6px 0 #0c041d,0 0 0 4px #ffffff22;text-shadow:0 3px 0 #0008;animation:pop .6s .2s cubic-bezier(.2,1.6,.4,1) both,shk .5s 1s}
.rib span{font-size:.7em}
.rib:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#fff0 30%,#fffb 50%,#fff0 70%);transform:translateX(-120%);animation:gls 2.6s 1.1s infinite}
@keyframes gls{to{transform:translateX(120%)}}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ecard{width:100%;max-width:330px;box-sizing:border-box;background:linear-gradient(#ffffff2e,#ffffff10);border:3px solid #ffffff66;border-radius:26px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;backdrop-filter:blur(6px);box-shadow:0 12px 30px #0005,inset 0 2px 0 #ffffff55;animation:pop .6s .35s cubic-bezier(.2,1.4,.4,1) both}
#end.win .ecard{background:linear-gradient(#6a240040,#6a240028);border-color:#ffffff99}
#end.lose .ecard{background:linear-gradient(#ffffff1a,#ffffff08);border-color:#ffffff33}
.chips{display:flex;gap:10px;width:100%}.chips>div{flex:1;background:#0006;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 3px 8px #0008}
.chips small{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.8}.chips b{font-size:30px;line-height:1.1;font-weight:900;color:#ffe082}.chips em{font-style:normal;font-size:14px;opacity:.7;margin-left:2px}
